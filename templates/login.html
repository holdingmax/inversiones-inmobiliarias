<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inversiones Inmobiliarias — Ingresar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="card-header">
      <i class="bi bi-buildings-fill" style="font-size:2.5rem; color:var(--gold);"></i>
      <h2 class="mt-2">Inversiones Inmobiliarias</h2>
      <p>Ingresá tus credenciales para continuar</p>
    </div>
    <div class="card-body">
      {% if error %}
        <div class="alert alert-danger py-2">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="nombre_usuario" class="form-control"
                   placeholder="Nombre de usuario" maxlength="30" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" class="form-control"
                   placeholder="Contraseña" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
        </button>
      </form>

      <p class="text-center text-muted mt-3 mb-0" style="font-size:.8rem;">
        Usuario inicial: <strong>ADMIN</strong> / Contraseña: <strong>1234</strong>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
