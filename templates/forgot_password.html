<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inversiones Inmobiliarias — Recuperar contraseña</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="card-header">
      <i class="bi bi-key-fill" style="font-size:2.5rem; color:var(--gold);"></i>
      <h2 class="mt-2">Recuperar contraseña</h2>
      <p>Ingresá tu usuario y te enviamos instrucciones por mail</p>
    </div>
    <div class="card-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">
            <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="mb-4">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="nombre_usuario" class="form-control"
                   placeholder="Nombre de usuario" maxlength="30" required autofocus>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-envelope-fill me-2"></i>Enviar instrucciones
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('login') }}"><i class="bi bi-arrow-left me-1"></i>Volver al login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
