<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inversiones Inmobiliarias — Nueva contraseña</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="card-header">
      <i class="bi bi-shield-lock-fill" style="font-size:2.5rem; color:var(--gold);"></i>
      <h2 class="mt-2">Nueva contraseña</h2>
      <p>Elegí una contraseña nueva para tu cuenta</p>
    </div>
    <div class="card-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Contraseña nueva</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" class="form-control"
                   placeholder="Mínimo 6 caracteres" minlength="6" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirmar contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password_confirm" class="form-control"
                   placeholder="Repetí la contraseña" minlength="6" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login w-100">
          <i class="bi bi-check-circle-fill me-2"></i>Actualizar contraseña
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
