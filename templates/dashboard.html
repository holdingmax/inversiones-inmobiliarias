{% extends 'base.html' %}
{% block title %}Dashboard — Inversiones Inmobiliarias{% endblock %}

{% block content %}
<div class="text-center mb-4">
  <h2 class="fw-bold" style="color:var(--navy);">Panel Principal</h2>
  <p class="text-muted">Seleccioná una sección para continuar</p>
</div>

<div class="row g-4 justify-content-center" style="max-width:780px; margin:auto;">

  <div class="col-6 col-md-5">
    <a href="{{ url_for('propiedad') }}" class="dash-card">
      <i class="bi bi-house-fill"></i>
      <span>Propiedad</span>
    </a>
  </div>

  <div class="col-6 col-md-5">
    <a href="{{ url_for('carga') }}" class="dash-card">
      <i class="bi bi-plus-circle-fill"></i>
      <span>Carga de Información</span>
    </a>
  </div>

  <div class="col-6 col-md-5">
    <a href="{{ url_for('reportes') }}" class="dash-card">
      <i class="bi bi-bar-chart-line-fill"></i>
      <span>Reportes</span>
    </a>
  </div>

  <div class="col-6 col-md-5">
    <a href="{{ url_for('configuracion') }}" class="dash-card">
      <i class="bi bi-gear-fill"></i>
      <span>Configuración</span>
    </a>
  </div>

</div>
{% endblock %}
